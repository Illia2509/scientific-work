{% extends 'base.html' %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="card narrow">
    <h2>Вхід</h2>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div>
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="error">{{ field.errors|join:', ' }}</div>{% endif %}
            </div>
        {% endfor %}
        <button class="button" type="submit">Увійти</button>
    </form>
</div>
{% endblock %}
